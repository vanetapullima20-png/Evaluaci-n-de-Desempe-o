  let idx = [];
  [9,8,7,6,3,1].forEach(q=>{
    (FULL_Q[q]||[]).forEach(p=>idx.push({n:p[0],c:p[1],p26:p[2],p25:p[3],ces:p[4],ind:p[5],asc:p[6],q}));
  });
  window._searchIdx = idx;
}
function doSearch(val){
  const res = document.getElementById('gr');
  if(!val || val.length<2){ res.style.display='none'; return; }
  const hits = (window._searchIdx||[]).filter(p=>p.n.toLowerCase().includes(val.toLowerCase())).slice(0,10);
  if(!hits.length){ res.style.display='none'; return; }
  res.style.display='block';
  res.innerHTML = hits.map(p=>{
    const cat26 = getCat(p.p26);
    const p25txt = (p.p25===null||p.p25===undefined) ? '-' : `${p.p25}%`;
    let arrow = '';
    if(p.p25!==null && p.p25!==undefined){
      if(p.p26>p.p25) arrow = ' <span style="color:#6dd56d">▲</span>';
      else if(p.p26<p.p25) arrow = ' <span style="color:#f07070">▼</span>';
    }
    return `<div class="sri"><strong>${p.n}</strong><span>${p.c} · Q${p.q} · 2025: ${p25txt} → 2026: ${p.p26}%${arrow} · <span class="bdg ${cat26.c}" style="font-size:10px">${cat26.l}</span></span></div>`;
  }).join('');
}

// ===== CAMPANA DE GAUSS (distribución de resultados) =====
function bellCurveSVG(){
  const cats = [
    {l:'No cumple con el estándar', pct:0.33, n:1},
    {l:'Requiere mejora', pct:35.5, n:109},
    {l:'Cumple con lo esperado en el puesto', pct:52.12, n:160},
    {l:'Supera las expectativas del puesto', pct:12.05, n:37},
    {l:'Resultados excepcionales constantes', pct:0, n:0},
  ];
  const W=280, H=100, pad=18;
  const maxPct = 55;
  const pts = cats.map((c,i)=>{
    const x = pad + i*((W-2*pad)/(cats.length-1));
    const y = H - pad - (c.pct/maxPct)*(H-2*pad-14);
    return {x,y,...c};
  });
  // Smooth path (catmull-rom to bezier approx)
  function smoothPath(pts){
    let d = `M ${pts[0].x} ${pts[0].y}`;
    for(let i=0;i<pts.length-1;i++){
      const p0 = pts[i-1]||pts[i];
      const p1 = pts[i];
      const p2 = pts[i+1];
      const p3 = pts[i+2]||p2;
      const cp1x = p1.x + (p2.x-p0.x)/6;
      const cp1y = p1.y + (p2.y-p0.y)/6;
      const cp2x = p2.x - (p3.x-p1.x)/6;
      const cp2y = p2.y - (p3.y-p1.y)/6;
      d += ` C ${cp1x} ${cp1y}, ${cp2x} ${cp2y}, ${p2.x} ${p2.y}`;
    }
    return d;
  }
  const path = smoothPath(pts);
  const dots = pts.map((p,i)=>`<circle class="bell-dot" cx="${p.x}" cy="${p.y}" r="4" fill="#2bd5c4" onmouseenter="showBellTip(event,${i})" onmouseleave="hideBellTip()" onclick="showBellTip(event,${i})"></circle>`).join('');
  return `
    <div style="font-size:11px;color:#c5c5c5;margin-bottom:4px;display:flex;align-items:center;gap:6px"><span style="width:9px;height:9px;background:#2bd5c4;border-radius:2px;display:inline-block"></span>Resultado final</div>
    <svg width="${W}" height="${H}" viewBox="0 0 ${W} ${H}">
      <path d="${path}" fill="none" stroke="#2bd5c4" stroke-width="2.2"/>
      ${dots}
    </svg>
    <div id="bellTip" class="bell-tip"></div>
  `;
}
const BELL_CATS = [
  {l:'No cumple con el estándar', pct:0.33, n:1},
  {l:'Requiere mejora', pct:35.5, n:109},
  {l:'Cumple con lo esperado en el puesto', pct:52.12, n:160},
  {l:'Supera las expectativas del puesto', pct:12.05, n:37},
  {l:'Resultados excepcionales constantes', pct:0, n:0},
];
function showBellTip(ev, i){
  const c = BELL_CATS[i];
  const tip = document.getElementById('bellTip');
  if(!tip) return;
  tip.innerHTML = `<b>${c.l}</b>Resultado final: ${c.pct}%<br>${c.n} colaboradores`;
  tip.style.display = 'block';
  const wrap = ev.target.closest('.bell-wrap');
  const rect = ev.target.getBoundingClientRect();
  const wrapRect = wrap.getBoundingClientRect();
  tip.style.left = Math.min(Math.max((rect.left-wrapRect.left)-40,0), wrapRect.width-140) + 'px';
  tip.style.top = (rect.top-wrapRect.top-58) + 'px';
}
function hideBellTip(){
  const tip = document.getElementById('bellTip');
  if(tip) tip.style.display='none';
}

function renderNineBoxArea(area){
  const ppl = area.ppl;
  const counts = {};
  ppl.forEach(p=>{ counts[p[6]] = (counts[p[6]]||0)+1; });
  const QORD=[[5,8,9],[2,6,7],[1,3,4]];
  let ngHtml = '<div class="ng">';
  QORD.forEach(row=>row.forEach(q=>{
    const n = counts[q]||0;
    ngHtml += `<div class="nc" style="background:${QCOLS[q]}" onclick="showQArea(${q})"><div class="nn">${n}</div><div class="nq">Q${q}</div></div>`;
  }));
  ngHtml += '</div>';

  const cat26 = getCat(area.avg26);
  const cat25 = getCat(area.avg25);
  const delta = +(area.avg26-area.avg25).toFixed(1);
  const deltaCls = delta>=0 ? 'delta-up' : 'delta-down';
  const deltaSign = delta>=0?'+':'';
  const arrow = delta>=0 ? '▲' : '▼';

  document.getElementById('p2').innerHTML = `
    <div class="card" style="background:#0a1a18;border:1px solid #2bd5c4"><div style="font-size:14px;font-weight:600;color:#2bd5c4;margin-bottom:5px">① Nine Box — ${area.nombre}</div>
      <div style="font-size:13px;color:#c5c5c5;line-height:1.6">Posiciona a cada colaborador de tu área según <strong style="color:#fff">objetivos</strong> (horizontal) y <strong style="color:#fff">competencias</strong> (vertical).</div>
    </div>
    <div class="st" style="margin-top:0"><span class="snum">2</span>Matriz interactiva</div>
    <div style="display:flex;gap:16px;flex-wrap:wrap;align-items:flex-start">
      <div style="flex-shrink:0">${ngHtml}
        <div style="margin-top:10px;font-size:10.5px;color:#c5c5c5">♾ Indeterminado</div>
      </div>
      <div class="qd" id="qdBox"><div style="font-size:14px;color:#c5c5c5">Selecciona un cuadrante para ver el detalle</div></div>
    </div>
    <div class="st"><span class="snum">3</span>Resultado final del área — evolución 2025 → 2026</div>
    <div class="card">
      <div style="display:flex;gap:24px;flex-wrap:wrap;align-items:flex-end">
        <div style="flex:1;min-width:120px">
          <div class="vchart" style="gap:14px;height:110px">
            <div class="vbar-wrap"><div class="vbar-cont"><div class="vbar" style="height:${(area.avg25/Math.max(area.avg25,area.avg26)*100).toFixed(0)}%;background:#7a7a7a"><span style="font-size:12px;color:#fff">${area.avg25}%</span></div></div><div style="font-size:12px;color:#c5c5c5;text-align:center;margin-top:5px">2025<br><span style="font-size:10px">${area.n25} pers.</span></div></div>
            <div class="vbar-wrap"><div class="vbar-cont"><div class="vbar" style="height:${(area.avg26/Math.max(area.avg25,area.avg26)*100).toFixed(0)}%;background:#2bd5c4"><span style="font-size:12px;color:#00403a">${area.avg26}%</span></div></div><div style="font-size:12px;color:#2bd5c4;text-align:center;margin-top:5px">2026<br><span style="font-size:10px">${area.n26} pers.</span></div></div>
          </div>
        </div>
        <div style="text-align:center">
          <div style="font-size:26px;font-weight:700" class="${deltaCls}">${arrow} ${deltaSign}${delta}pp</div>
          <div style="font-size:11.5px;color:#c5c5c5;margin-top:4px">${delta>=0?'El área mejoró':'El área bajó'} respecto a 2025</div>
        </div>
        <div style="display:flex;flex-direction:column;gap:6px">
          <div><span class="bdg ${cat25.c}" style="font-size:11px">2025: ${cat25.l}</span></div>
          <div><span class="bdg ${cat26.c}" style="font-size:11px">2026: ${cat26.l}</span></div>
        </div>
      </div>
    </div>
  `;
  window._currentPpl = ppl;
}
function showQArea(q){
  const ppl = window._currentPpl.filter(p=>p[6]===q).sort((a,b)=>b[2]-a[2]);
  renderQTable(ppl, q, 'qdBox');
}

      if(p[3]!==null && p[3]!==undefined){
        if(p[2]>p[3]) arrow = ' <span style="color:#6dd56d">▲</span>';

function sp(id){
  document.querySelectorAll('.pg').forEach(p=>p.classList.remove('on'));
  document.querySelectorAll('.tab').forEach(t=>t.classList.remove('on'));
  document.getElementById(id).classList.add('on');
  const map = {p1:0,p2:1,p3:2,p4:3,p5:4};
  const idx = map[id]||0;
  const tabs = document.querySelectorAll('.tab');
  if(tabs[idx]) tabs[idx].classList.add('on');
}
